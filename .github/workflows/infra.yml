name: infra

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [plan, apply, destroy]
        default: plan
      allowed_cidr:
        description: "Your public IP as a /32 (blank = use repo variable ALLOWED_CIDR)"
        type: string
        required: false
      instance_class:
        description: "DB instance class (try db.t3.micro if db.t4g.micro has no capacity)"
        type: string
        default: db.t4g.micro
      availability_zone:
        description: "Optional AZ such as us-east-1a (blank = let RDS choose)"
        type: string
        required: false
      confirm:
        description: "For destroy only: type the DB identifier (pilot-test-pg) to confirm"
        type: string
        required: false
  # Cost guardrail: nightly destroy at 1am US Eastern (05:00 UTC during EDT).
  # Only runs when the repo variable NIGHTLY_DESTROY is set to "true".
  schedule:
    - cron: "0 5 * * *"

permissions:
  id-token: write
  contents: read

concurrency:
  group: pilot-infra
  cancel-in-progress: false

env:
  ACTION: ${{ github.event_name == 'schedule' && 'destroy' || inputs.action }}
  TF_VAR_allowed_cidr: ${{ inputs.allowed_cidr || vars.ALLOWED_CIDR || '0.0.0.0/32' }}
  TF_VAR_instance_class: ${{ inputs.instance_class || 'db.t4g.micro' }}
  TF_VAR_availability_zone: ${{ inputs.availability_zone || '' }}
  TF_IN_AUTOMATION: "true"

jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || vars.NIGHTLY_DESTROY == 'true'
    runs-on: ubuntu-latest
    # Manual destroys use the "destroy" environment (add required reviewers there
    # if you want an approval click). Everything else uses "deploy".
    environment: ${{ (github.event_name == 'workflow_dispatch' && inputs.action == 'destroy') && 'destroy' || 'deploy' }}
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - name: Guard destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: |
          if [ "${{ inputs.confirm }}" != "pilot-test-pg" ]; then
            echo "::error::To destroy, set the 'confirm' input to pilot-test-pg."
            exit 1
          fi

      - name: Guard allowed_cidr
        if: env.ACTION != 'destroy'
        run: |
          if [ "$TF_VAR_allowed_cidr" = "0.0.0.0/32" ]; then
            echo "::error::Provide allowed_cidr (your IP as x.x.x.x/32) as an input or set the ALLOWED_CIDR repo variable."
            exit 1
          fi
      - name: Debug OIDC claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' \
            | awk '{while(length($0)%4)$0=$0"="; print}' \
            | base64 -d | jq '{iss, aud, sub, repository, environment}'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"
          terraform_wrapper: false

      - name: Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=pilot-test-pg/terraform.tfstate" \
            -backend-config="region=us-east-1"

      - name: Validate
        run: terraform validate

      - name: Plan
        if: env.ACTION == 'plan'
        run: terraform plan -input=false

      - name: Apply
        if: env.ACTION == 'apply'
        run: terraform apply -input=false -auto-approve

      - name: Destroy
        if: env.ACTION == 'destroy'
        run: terraform destroy -input=false -auto-approve

      - name: Summary
        if: env.ACTION == 'apply'
        run: |
          {
            echo "### pilot-test-pg is up"
            echo ""
            echo "Endpoint: \`$(terraform output -raw endpoint)\`"
            echo ""
            echo "Master password secret: \`$(terraform output -raw master_secret_arn || echo n/a)\`"
          } >> "$GITHUB_STEP_SUMMARY"
